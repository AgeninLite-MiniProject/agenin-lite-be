name: CI

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - main
      - development
      - "feat/**"
      - "fix/**"
      - "chore/**"
  pull_request:
    branches:
      - main
      - development
      - "feat/**"
      - "fix/**"
      - "chore/**"

jobs:
  # ─────────────────────────────────────────────
  # Backend: Maven + JaCoCo
  # ─────────────────────────────────────────────
  backend:
    name: Backend Tests (Java 21)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: agenin_test
          POSTGRES_USER: agenin
          POSTGRES_PASSWORD: agenin_test_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/agenin_test
      SPRING_DATASOURCE_USERNAME: agenin
      SPRING_DATASOURCE_PASSWORD: agenin_test_pw
      JWT_SECRET: ci_test_secret_do_not_use_in_production_at_all

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run tests + generate JaCoCo report
        run: ./mvnw verify -B

      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/site/jacoco/jacoco.xml
          flags: backend
          fail_ci_if_error: false

      - name: Detailed JaCoCo Report
        if: always()
        uses: Madrapps/jacoco-report@v1.6.2
        with:
          paths: ${{ github.workspace }}/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 100
          min-coverage-changed-files: 100
          title: "Backend Coverage Details"
          update-comment: true
